name: Application checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ksi
          POSTGRES_PASSWORD: development
          POSTGRES_DB: ksi
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U ksi" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      KSI_TEST_DATABASE_URL: postgres://ksi:development@127.0.0.1:5432/ksi?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
        working-directory: frontend
      - run: bun run contracts:check
        working-directory: frontend
      - run: bun run lint
        working-directory: frontend
      - run: bun run test
        working-directory: frontend
      - run: make build
      - run: go vet ./...
      - run: go test -race ./...
      - run: docker compose -f compose.browser.yaml up -d --wait
      - run: bun run test:docker
        working-directory: frontend
      - run: docker build -t assessment-workspace:check .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: frontend/test-results/
