services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ksi
      POSTGRES_USER: ksi
      POSTGRES_PASSWORD: ksi-local-development
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ksi -d ksi"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
